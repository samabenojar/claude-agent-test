name: Claude Headless POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Claude Code
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://claude.ai/install.sh | bash

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/claude" --version

      - name: Test claude -p
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          claude -p \
            "Reply with exactly HEADLESS_OK and nothing else." \
            --max-turns 1 \
            --output-format json \
            > claude-output.json

          cat claude-output.json

          grep -q '"result":"HEADLESS_OK"' claude-output.json

          echo "GitHub headless Claude test PASSED."

      - name: Upload Claude result
        uses: actions/upload-artifact@v6
        with:
          name: claude-headless-output
          path: claude-output.json
