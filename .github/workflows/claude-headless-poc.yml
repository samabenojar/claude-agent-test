name: dbt DEV Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dbt-build:
    name: Build dbt baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Important:
    # This changes the GitHub OIDC subject to:
    # ...:environment:dbt-dev
    environment: dbt-dev

    env:
      DBT_PROJECT_DIR: dbt_demo
      DBT_CORE_VERSION: "1.12.6"
      DBT_SNOWFLAKE_VERSION: "1.12.4"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned dbt runtime
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "dbt-core==${DBT_CORE_VERSION}" \
            "dbt-snowflake==${DBT_SNOWFLAKE_VERSION}"
          python -m pip check

          echo "dbt version:"
          dbt --version

      - name: Create temporary dbt profile
        shell: bash
        run: |
          set -euo pipefail

          PROFILE_NAME="$(
            awk '
              /^profile:/ {
                gsub(/["'"'"']/, "", $2)
                print $2
                exit
              }
            ' "${DBT_PROJECT_DIR}/dbt_project.yml"
          )"

          if [ -z "${PROFILE_NAME}" ]; then
            echo "Could not determine profile name from dbt_project.yml"
            exit 1
          fi

          echo "Using dbt profile: ${PROFILE_NAME}"

          PROFILE_DIR="${RUNNER_TEMP}/dbt-profile"
          mkdir -p "${PROFILE_DIR}"

          cat > "${PROFILE_DIR}/profiles.yml" <<EOF
          ${PROFILE_NAME}:
            target: github_ci
            outputs:
              github_ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                database: DBT_DEMO
                schema: CLAUDE_DBT_DEV
                warehouse: CLAUDE_WH
                role: CLAUDE_DBT_DEV
                threads: 4
                authenticator: workload_identity
                workload_identity_provider: OIDC
                token: "{{ env_var('SNOWFLAKE_TOKEN') }}"
          EOF

          chmod 600 "${PROFILE_DIR}/profiles.yml"

          echo "DBT_PROFILES_DIR=${PROFILE_DIR}" >> "${GITHUB_ENV}"

      - name: Install Snowflake CLI and obtain GitHub OIDC token
        uses: snowflakedb/snowflake-actions@424478745f451798751b44a7bde98080aba1cf9c # v3
        with:
          use-oidc: true
          oidc-token-name: SNOWFLAKE_TOKEN

      - name: Install dbt packages
        shell: bash
        run: |
          set -euo pipefail

          dbt deps \
            --project-dir "${DBT_PROJECT_DIR}" \
            --profiles-dir "${DBT_PROFILES_DIR}"

      - name: Validate dbt connection
        shell: bash
        run: |
          set -euo pipefail

          dbt debug \
            --project-dir "${DBT_PROJECT_DIR}" \
            --profiles-dir "${DBT_PROFILES_DIR}" \
            --target github_ci

      - name: Run dbt baseline build
        shell: bash
        run: |
          set -euo pipefail

          dbt build \
            --project-dir "${DBT_PROJECT_DIR}" \
            --profiles-dir "${DBT_PROFILES_DIR}" \
            --target github_ci

      - name: Show dbt result summary
        if: always()
        shell: bash
        run: |
          echo "dbt target contents:"
          find "${DBT_PROJECT_DIR}/target" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' 2>/dev/null || true

          echo
          echo "dbt log tail:"
          tail -100 "${DBT_PROJECT_DIR}/logs/dbt.log" 2>/dev/null || true

      - name: Upload dbt artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dbt-dev-baseline
          path: |
            dbt_demo/target/manifest.json
            dbt_demo/target/run_results.json
            dbt_demo/target/catalog.json
            dbt_demo/logs/dbt.log
          if-no-files-found: warn
