version: 2
sources:
  - name: staging
    database: "{{ env_var('DBT_SOURCE_DATABASE', 'DBT_DEMO') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'STAGING') }}"
    tables:
      - name: events
        identifier: STG_EVENTS
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests: [not_null]
          - name: event_ts
            data_tests: [not_null]
          - name: amount
            data_tests: [not_null]
